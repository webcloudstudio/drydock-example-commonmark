[project]
name = "commonmark"
version = "0.1.0"
description = "Self-contained CommonMark 0.31.2 parser and HTML renderer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
commonmark = "commonmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["commonmark*"]
